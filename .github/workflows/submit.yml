name: Submit to the community index

# These mods are listed twice: here, in this repo's own feed, and in the wider
# community index at bryanthaboi/gen1recomp-mod-index. The second one takes a
# pull request, and a pull request against someone else's repo needs a fork, a
# branch on it and the PR itself -- none of which the built-in GITHUB_TOKEN can
# do, because it is scoped to this repository and nothing else.
#
# So this job runs on a token you make yourself, and everything it touches it
# touches as you: your fork, your commit, your pull request, your name on it.
# Nothing here is opened by a bot account.
#
# Setup, once, and all of it works from a phone browser:
#
#   1. github.com/settings/tokens/new -- classic token, scope `public_repo`,
#      which is the same narrow scope their own submission page asks for.
#      Copy it; GitHub shows it once.
#   2. This repo > Settings > Secrets and variables > Actions > New repository
#      secret. Paste the token there. GEN1INDEX is the name this repo uses;
#      the job also answers to INDEX_PR_TOKEN and a few other likely names.
#      It has to be that page: the Codespaces and Dependabot tabs beside it
#      hold their own secrets, which a workflow cannot read.
#   3. Actions > Submit to the community index > Run workflow.
#
# After that it is step 3 on its own, any time there is something new to send:
# a new mod folder here, an edited description, a better thumbnail. Their
# release job picks up new *versions* by itself, so a version bump alone is
# never a reason to run this.
#
# Running it is the submission: the button is the whole thing. `dry run` is
# there for a change you want to look at first -- it does the same work, fork
# and copy and their validator, and stops before it pushes -- but it is off by
# default, because the usual reason to open this page is to send what is here.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check everything, push nothing'
        type: boolean
        default: false
      branch:
        description: 'Branch to open the pull request from'
        type: string
        default: 'wild-mods'

# The built-in token does none of this work beyond reading this repo; the
# fork, the branch and the pull request are all the personal token's.
permissions:
  contents: read

concurrency:
  group: submit
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    env:
      UPSTREAM: bryanthaboi/gen1recomp-mod-index
      BRANCH: ${{ inputs.branch }}
    steps:
      - uses: actions/checkout@v4

      # A token pasted on a phone arrives with a trailing newline as often as
      # not, and a secret is easy to file under a name nothing is reading. So
      # take the first of the names anyone would plausibly have used, strip the
      # whitespace off it, and say which one answered.
      - name: Find the token
        env:
          GEN1INDEX: ${{ secrets.GEN1INDEX }}
          INDEX_PR_TOKEN: ${{ secrets.INDEX_PR_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          PAT: ${{ secrets.PAT }}
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
          INDEX_TOKEN: ${{ secrets.INDEX_TOKEN }}
          SUBMIT_TOKEN: ${{ secrets.SUBMIT_TOKEN }}
        run: |
          set -euo pipefail
          for name in GEN1INDEX INDEX_PR_TOKEN GH_PAT PAT GITHUB_PAT INDEX_TOKEN SUBMIT_TOKEN; do
            value=$(printf '%s' "${!name-}" | tr -d '[:space:]')
            if [ -n "$value" ]; then
              # Masked before it is written anywhere, so a later command that
              # echoes its environment cannot spill it into the log.
              echo "::add-mask::$value"
              echo "GH_TOKEN=$value" >> "$GITHUB_ENV"
              echo "Using the $name secret."
              exit 0
            fi
          done
          echo "::error::No token secret found. Add one at" \
               "https://github.com/${{ github.repository }}/settings/secrets/actions" \
               "-- the Actions tab, under Repository secrets, named" \
               "INDEX_PR_TOKEN. A secret on the Codespaces or Dependabot tab" \
               "is a different secret and a workflow cannot read it."
          exit 1

      # Fail here, with the reason, rather than four steps later inside a git
      # push that says only that authentication failed.
      - name: Check the token works
        run: |
          set -euo pipefail
          if ! LOGIN=$(gh api /user --jq .login 2>token-error.txt); then
            echo "::error::That token did not authenticate: $(head -2 token-error.txt | tr '\n' ' ')." \
                 "It may have expired, or been copied short."
            exit 1
          fi
          SCOPES=$(gh api -i /user 2>/dev/null | tr -d '\r' \
            | awk -F': ' 'tolower($1)=="x-oauth-scopes"{print $2}')
          echo "Signed in as $LOGIN. Scopes: ${SCOPES:-none reported}"
          case ",${SCOPES// /}," in
            *,repo,*|*,public_repo,*) ;;
            *)
              if [ -n "$SCOPES" ]; then
                echo "::error::This token has [$SCOPES]. Forking and opening a" \
                     "pull request needs public_repo (or repo). Make a new one" \
                     "at https://github.com/settings/tokens/new?scopes=public_repo"
                exit 1
              fi
              # A fine-grained token reports no scopes at all; let it try.
              echo "::notice::No scope header -- a fine-grained token. Carrying on."
              ;;
          esac

      # The fork is somewhere to put a branch, and nothing else. What gets
      # cloned is upstream itself.
      #
      # A fork that has sat for a while cannot be brought up to date with a
      # public_repo token: syncing merges their commits, some of which touch
      # .github/workflows, and GitHub wants the workflow scope for that. The
      # first run here hit exactly that, carried on against a stale fork, and
      # validated a cart with a copy of validate.mjs written before carts
      # existed. Cloning upstream sidesteps all of it: current schema, current
      # rules, and the entries as they actually stand, which is also what
      # decides whether an entry of ours is new there or already listed.
      - name: Fork if there is no fork, and clone upstream
        run: |
          set -euo pipefail
          gh auth setup-git
          gh repo fork "$UPSTREAM" --clone=false --default-branch-only
          LOGIN=$(gh api /user --jq .login)
          git clone --depth 1 "https://github.com/$UPSTREAM" index
          {
            echo "LOGIN=$LOGIN"
            echo "USER_ID=$(gh api /user --jq .id)"
          } >> "$GITHUB_ENV"

      - name: Copy this index's entries in
        run: python3 tools/make_submission.py index | tee submission.log

      # Their check, not ours, run before anything is pushed: a pull request
      # that fails their CI wastes a maintainer's afternoon rather than a
      # minute of this runner.
      - name: Run their validator
        run: |
          set -euo pipefail
          TARGETS=$(cd "$GITHUB_WORKSPACE" && ls -d mods/*/ carts/*/ \
            | sed 's:/$::' | tr '\n' ' ')
          cd index
          node scripts/validate.mjs $TARGETS

      - name: Commit as you
        run: |
          set -euo pipefail
          cd index
          # The noreply address GitHub itself hands out, so the commit is
          # attributed to your account without putting a real address in a
          # public log.
          git config user.name "$LOGIN"
          git config user.email "${USER_ID}+${LOGIN}@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add mods carts
          if git diff --cached --quiet; then
            echo "::notice::Nothing to submit -- their index already matches this one."
            echo "NOTHING=1" >> "$GITHUB_ENV"
            exit 0
          fi
          git commit -m "Add the mods I maintain, and the Wild Green cart"

      - name: Summary
        run: |
          {
            echo '## What would go'
            echo '```'
            cat submission.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push it and open the pull request
        if: ${{ !inputs.dry_run && env.NOTHING != '1' }}
        run: |
          set -euo pipefail
          cd index
          FORK="$LOGIN/${UPSTREAM#*/}"

          # One commit, whose parent is the upstream commit this clone sits on.
          # A fork shares upstream's object storage, so that parent is already
          # there and the push carries our commit alone -- no workflow files in
          # it, so nothing for a public_repo token to be refused over. Placing
          # the branch by ref first was the idea before this; the fork is far
          # enough behind that the API would not create a ref at that object.
          git push --force "https://github.com/$FORK.git" "HEAD:refs/heads/$BRANCH"

          # REST rather than `gh pr list` and `gh pr create`: those go through
          # GraphQL, which a classic token cannot reach on public_repo alone --
          # it wants the full repo scope. Run 5 never got this far, so this is
          # a fix for a wall we were walking into rather than one we hit.
          EXISTING=$(gh api "/repos/$UPSTREAM/pulls?state=open&head=$LOGIN:$BRANCH" \
            --jq '.[0].html_url // empty')
          if [ -n "$EXISTING" ]; then
            echo "::notice::Updated the open pull request: $EXISTING"
            echo "Updated $EXISTING" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          URL=$(gh api -X POST "/repos/$UPSTREAM/pulls" \
            -f title="Add the mods I maintain, and the Wild Green cart" \
            -f head="$LOGIN:$BRANCH" -f base=main \
            -f body="$(cat "$GITHUB_WORKSPACE/.github/community-index-pr.md")" \
            --jq .html_url)
          echo "::notice::$URL"
          echo "Opened $URL" >> "$GITHUB_STEP_SUMMARY"
