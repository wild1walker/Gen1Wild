name: Build index

# The feed is metadata about releases that live in other repos, so it goes
# stale on its own schedule rather than on this repo's: the hourly run catches
# a mod that tagged a release, and a push picks up an entry edited here.
#
# Hourly rather than nightly because nightly is the wrong trade for a feed
# whose whole job is to be current: Gen1ModernBag tagged 1.1.0 at 22:32 and the
# feed still described 1.0.0, with nothing due to run until 05:17.  An hour's
# worst case is cheap -- a run is about fifteen seconds and commits nothing
# unless something moved.
#
# Not faster than hourly, because nothing downstream can use it.  This feed is
# what MODS > FIND MODS lists; it is not how an installed mod learns it is out
# of date.  That check is the game asking the mod's own repo directly, on its
# own six-hour cache (src/mods/ModUpdate.lua, CACHE_TTL), and it never reads
# this file.  So an index fresher than an hour would be answering a question
# no one is asking, and a schedule under about fifteen minutes is unreliable
# on GitHub's runners anyway.
#
# site/** is deliberately not a trigger -- this job commits into it, and a
# rebuild that changes nothing keeps the old generated_at, so a quiet hour is
# silent unless something actually moved.

on:
  push:
    branches: [main]
    paths:
      - 'mods/**'
      - 'carts/**'
      - 'tools/**'
      - '.github/workflows/index.yml'

  # :17 rather than :00, where every other hourly job on GitHub is queued.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the feed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/build_index.py

      - name: Check it is a feed the launcher can read
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          feed = json.load(open("site/data/index.json", encoding="utf-8"))
          assert feed["schema_version"] == 1, feed["schema_version"]
          assert isinstance(feed["mods"], list) and feed["mods"], "no mods"
          for m in feed["mods"]:
              assert m.get("id"), m
              assert m.get("title"), m
          print(f"{len(feed['mods'])} mod(s), schema {feed['schema_version']}")
          PY

      - name: Commit the feed if it moved
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # mods/*/meta.json is in here because the build syncs each entry's
          # fallback version to the release it resolved.  Without it CI would
          # rewrite those files every hour and commit none of them, so the
          # drift would come back the moment anyone looked.
          if git diff --quiet -- site/data/index.json 'mods/*/meta.json'; then
            echo "feed unchanged; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/index.json 'mods/*/meta.json'
          git commit -m "Rebuild the mod index feed"

          # main moves under this job: an entry landing while the nightly run is
          # in flight, or two rebuilds queued back to back.  A bare push loses
          # the rebuilt feed and goes red for a reason that has nothing to do
          # with the index, so a rejection is retried rather than failed on.
          #
          # The retry rebuilds rather than rebases.  The feed is a pure function
          # of mods/ plus each mod's Releases, so there is no merge to reason
          # about: take whatever landed, regenerate on top of it, and push that.
          # If the regenerated feed matches what is already there -- the usual
          # case, because the run that beat us published the same thing -- there
          # is nothing left to do and the job is done.
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected; rebuilding on top of origin/main (attempt $attempt)"
            sleep $((attempt * 3))
            git fetch origin main
            git reset --hard origin/main
            python3 tools/build_index.py
            if git diff --quiet -- site/data/index.json 'mods/*/meta.json'; then
              echo "the feed that landed is already current; nothing to push"
              exit 0
            fi
            git add site/data/index.json 'mods/*/meta.json'
            git commit -m "Rebuild the mod index feed"
          done
          echo "::error::could not push the rebuilt feed after 3 attempts"
          exit 1
