name: Build index

# The feed is metadata about releases that live in other repos, so it goes
# stale on its own schedule rather than on this repo's: a mod that tags a
# release says so and the feed rebuilds within the minute, nightly catches
# anything that did not say, and a push picks up an entry edited here.
#
# site/** is deliberately not a trigger -- this job commits into it, and a
# rebuild that changes nothing keeps the old generated_at, so the nightly run
# is silent unless something actually moved.

on:
  push:
    branches: [main]
    paths:
      - 'mods/**'
      - 'tools/**'
      - '.github/workflows/index.yml'

  # Each mod's release workflow fires this at us once its release is
  # published, so a card carries the new version straight away rather than
  # waiting up to a day for the nightly run to notice.  The payload is a
  # courtesy for the log -- the build reads every entry's releases from the
  # GitHub API regardless of who woke it, so a dispatch naming one mod still
  # produces exactly the feed the nightly run would have.
  repository_dispatch:
    types: [mod-released]

  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Say who woke this
        if: github.event_name == 'repository_dispatch'
        env:
          MOD: ${{ github.event.client_payload.mod }}
          VERSION: ${{ github.event.client_payload.version }}
          SENDER: ${{ github.event.client_payload.repository }}
        run: echo "Rebuilding because ${SENDER:-a mod repo} published ${MOD:-a mod} ${VERSION:-}"

      - name: Build the feed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/build_index.py

      - name: Check it is a feed the launcher can read
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          feed = json.load(open("site/data/index.json", encoding="utf-8"))
          assert feed["schema_version"] == 1, feed["schema_version"]
          assert isinstance(feed["mods"], list) and feed["mods"], "no mods"
          for m in feed["mods"]:
              assert m.get("id"), m
              assert m.get("title"), m
          print(f"{len(feed['mods'])} mod(s), schema {feed['schema_version']}")
          PY

      - name: Commit the feed if it moved
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- site/data/index.json; then
            echo "feed unchanged; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/index.json
          git commit -m "Rebuild the mod index feed"

          # main moves under this job: an entry landing while the nightly run is
          # in flight, or two rebuilds queued back to back.  A bare push loses
          # the rebuilt feed and goes red for a reason that has nothing to do
          # with the index, so a rejection is retried rather than failed on.
          #
          # The retry rebuilds rather than rebases.  The feed is a pure function
          # of mods/ plus each mod's Releases, so there is no merge to reason
          # about: take whatever landed, regenerate on top of it, and push that.
          # If the regenerated feed matches what is already there -- the usual
          # case, because the run that beat us published the same thing -- there
          # is nothing left to do and the job is done.
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected; rebuilding on top of origin/main (attempt $attempt)"
            sleep $((attempt * 3))
            git fetch origin main
            git reset --hard origin/main
            python3 tools/build_index.py
            if git diff --quiet -- site/data/index.json; then
              echo "the feed that landed is already current; nothing to push"
              exit 0
            fi
            git add site/data/index.json
            git commit -m "Rebuild the mod index feed"
          done
          echo "::error::could not push the rebuilt feed after 3 attempts"
          exit 1
