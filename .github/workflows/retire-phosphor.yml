name: Retire Phosphor

# One-shot: marks the last "Wild Green as one mod" release as discontinued and
# points it at the cart.  The release is kept as an archive; nothing builds it
# any more (README.md, "Wild Green as a single mod: discontinued").  Runs when
# this file lands on main, and can be re-run by hand; editing the same release
# twice changes nothing.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retire-phosphor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - name: Mark phosphor-v1.0.0 discontinued
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="phosphor-v1.0.0"
          if ! gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            echo "no $tag release; nothing to retire"
            exit 0
          fi
          notes="$(printf '%s\n' \
            "**Discontinued.** This was Wild Green flattened into one mod \`.zip\`," \
            "for anything that could import mods but not carts. It is no longer" \
            "built or updated, and is kept here only as an archive: it holds" \
            "Gen1WildQOL 1.30.0, Gen1WildUI 1.27.0 and a sprite mod Wild Green no" \
            "longer uses, months behind the cart." \
            "" \
            "**Install Wild Green as a cart instead:** in the game, MODS > FIND MODS," \
            "on the carts list, or the \`.g1rcart\` from" \
            "https://github.com/wild1walker/Gen1WildGreen/releases/latest" \
            "" \
            "Why it was retired: https://github.com/wild1walker/Gen1Wild#wild-green-as-a-single-mod-discontinued")"
          gh release edit "$tag" --repo "$REPO" \
            --title "Wild Green 1.0.0 (single mod) - discontinued" \
            --notes "$notes" \
            --prerelease \
            --latest=false
          gh release view "$tag" --repo "$REPO" --json name,isPrerelease \
            --jq '"\(.name) prerelease=\(.isPrerelease)"'
